name: Release

on:
  push:
    tags:
      - "v*"
      - "*-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  meta:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      package_path: ${{ steps.parse.outputs.package_path }}
      package_name: ${{ steps.parse.outputs.package_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            PACKAGE_PATH="packages/core"
            VERSION="${TAG#v}"
          else
            COMPONENT="${TAG%-v*}"
            PACKAGE_PATH="packages/$COMPONENT"
            VERSION="${TAG##*-v}"
          fi

          if [[ ! -f "$PACKAGE_PATH/package.json" ]]; then
            echo "package path $PACKAGE_PATH does not exist for tag $TAG" >&2
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./$PACKAGE_PATH/package.json').version")"
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "tag version $VERSION must match package.json version $PKG_VERSION" >&2
            exit 1
          fi

          PKG_NAME="$(node -p "require('./$PACKAGE_PATH/package.json').name")"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "package_path=$PACKAGE_PATH"
            echo "package_name=$PKG_NAME"
            if [[ "$VERSION" == *-* ]]; then
              echo "is_prerelease=true"
            else
              echo "is_prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: meta
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ needs.meta.outputs.package_name }}..." run build
      - run: pnpm --filter "${{ needs.meta.outputs.package_name }}..." run test
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: ${{ needs.meta.outputs.package_path }}/build

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [meta, build-and-test]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Restore build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: ${{ needs.meta.outputs.package_path }}/build
      - run: pnpm --filter "./${{ needs.meta.outputs.package_path }}" publish --access public --no-git-checks --provenance

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [meta, publish]
    environment: release
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.is_prerelease == 'false' && startsWith(github.ref_name, 'v') }}
