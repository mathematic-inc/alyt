name: Release

on:
  push:
    tags:
      - "v*"
      - "*-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      package_path: ${{ steps.parse.outputs.package_path }}
      package_name: ${{ steps.parse.outputs.package_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and package version
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            PACKAGE_PATH="packages/core"
            VERSION="${TAG#v}"
          else
            COMPONENT="${TAG%-v*}"
            PACKAGE_PATH="packages/$COMPONENT"
            VERSION="${TAG##*-v}"
          fi

          if [[ ! -f "$PACKAGE_PATH/package.json" ]]; then
            echo "package path $PACKAGE_PATH does not exist for tag $TAG" >&2
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./$PACKAGE_PATH/package.json').version")"
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "tag version $VERSION must match package.json version $PKG_VERSION" >&2
            exit 1
          fi

          PKG_NAME="$(node -p "require('./$PACKAGE_PATH/package.json').name")"

          {
            echo "tag=$TAG"
            echo "package_path=$PACKAGE_PATH"
            echo "package_name=$PKG_NAME"
            if [[ "$VERSION" == *-* ]]; then
              echo "is_prerelease=true"
            else
              echo "is_prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and test
    needs:
      - validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm --filter "${PACKAGE_NAME}..." run build
        env:
          PACKAGE_NAME: ${{ needs.validate-release.outputs.package_name }}
      - name: Run tests
        run: pnpm --filter "${PACKAGE_NAME}..." run test
        env:
          PACKAGE_NAME: ${{ needs.validate-release.outputs.package_name }}
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: ${{ needs.validate-release.outputs.package_path }}/build

  publish-npm:
    name: Publish to npm
    needs:
      - validate-release
      - build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output
          path: ${{ needs.validate-release.outputs.package_path }}/build
      - name: Publish to npm
        run: pnpm --filter "./${PACKAGE_PATH}" publish --access public --no-git-checks --provenance
        env:
          PACKAGE_PATH: ${{ needs.validate-release.outputs.package_path }}

  create-release:
    name: Create GitHub release
    needs:
      - validate-release
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.validate-release.outputs.is_prerelease }}
          REF_NAME: ${{ github.ref_name }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          options=(--title "$TAG" --generate-notes)
          if [[ "$IS_PRERELEASE" == true ]]; then
            options+=(--prerelease --latest=false)
          elif [[ "$REF_NAME" == v* ]]; then
            options+=(--latest)
          else
            options+=(--latest=false)
          fi
          gh release create "$TAG" "${options[@]}"
