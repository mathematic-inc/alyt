name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Validate packages
        run: pnpm pack --recursive --dry-run
      - name: Check types
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Audit dependencies
        run: pnpm audit
      - name: Build Next.js example
        working-directory: examples/nextjs
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Audit Next.js example
        working-directory: examples/nextjs
        run: npm audit --audit-level high

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Check and generate ToolConfig files
        uses: mathematic-inc/toolconfig-action@1baf7b021e8bf6f0e20737753c13af0fc93c8570 # v2026.11.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The type-aware oxlint rules read the packages that the build writes.
      - name: Build packages
        run: pnpm build
      - name: Install Next.js example dependencies
        working-directory: examples/nextjs
        run: npm ci --ignore-scripts
      - name: Run checks
        run: hk check --all --slow --skip-step toolconfig

  required:
    name: required
    if: always()
    needs:
      - build-and-test
      - check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every other job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A job did not pass or did not run."
            exit 1
          fi
