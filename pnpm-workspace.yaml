packages:
  - packages/*
  - examples/sveltekit

autoInstallPeers: false

packageExtensions:
  "@sveltejs/package@2.5.8":
    peerDependencies:
      typescript: "^5.0.0 || ^6.0.0"

overrides:
  next: 16.3.8
  source-map-js: 1.2.2
  devalue: 5.9.3
  dompurify: 3.4.16
  undici: 8.10.2
  vite: 8.2.2
  "@sveltejs/kit>cookie": ^0.7.2
  sharp: 0.35.5

allowBuilds:
  core-js: false

minimumReleaseAgeExclude:
  - "@posthog/types@1.407.0"
  - "@types/node@26.4.0"
  - posthog-js@1.421.0
